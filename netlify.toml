[build]
  command = "bun scripts/check-migrations.ts && bun run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  BUN_VERSION = "1.3.14"

[context."test/test-006"]
  command = "node experiments/database-burst/build.mjs"

[context."chore/dev-017"]
  command = "node experiments/staging-rollout/build.mjs"
  functions = "experiments/staging-rollout/netlify/functions"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
