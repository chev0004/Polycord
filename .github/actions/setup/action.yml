name: Setup
description: Install Node, Bun and the locked dependencies
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.14'
    - run: bun install --frozen-lockfile
      shell: bash
