name: Playwright Chromium
description: Install Chromium and its system packages, caching the browser download
runs:
  using: composite
  steps:
    - id: browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
    - if: steps.browsers.outputs.cache-hit != 'true'
      run: bun run playwright install --with-deps chromium
      shell: bash
    - if: steps.browsers.outputs.cache-hit == 'true'
      run: bun run playwright install-deps chromium
      shell: bash
