name: Production

on:
  workflow_dispatch:

concurrency:
  group: netlify-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'chev0004/Polycord' &&
      github.ref == 'refs/heads/main' &&
      vars.NETLIFY_PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      checks: read
      contents: read
    environment:
      name: production
      url: https://${{ vars.POLYCORD_PRODUCTION_DOMAIN }}
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GITHUB_TOKEN: ${{ github.token }}
      NETLIFY_PRODUCTION_SITE_ID: ${{ vars.NETLIFY_PRODUCTION_SITE_ID }}
      POLYCORD_PRODUCTION_DOMAIN: ${{ vars.POLYCORD_PRODUCTION_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: node scripts/deploy-production.mjs
