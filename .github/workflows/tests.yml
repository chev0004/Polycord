name: Tests

on:
  pull_request:
  push:
    branches: [develop, prod]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      validate: ${{ steps.plan.outputs.validate }}
      static: ${{ steps.plan.outputs.static }}
      unit: ${{ steps.plan.outputs.unit }}
      package: ${{ steps.plan.outputs.package }}
      e2e: ${{ steps.plan.outputs.e2e }}
      storybook: ${{ steps.plan.outputs.storybook }}
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 50 }}
      - uses: ./.github/actions/setup
      - id: plan
        run: node scripts/develop-plan.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SCOPED_PLANS: ${{ vars.CI_SCOPED_PLANS }}

  static:
    needs: gate
    if: needs.gate.outputs.static == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run check:all

  unit:
    needs: [gate, static]
    if: needs.gate.outputs.unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: polycord_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/polycord_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/polycord_test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run db:migrate
      - run: node --test scripts/*.node.mjs
      - run: bun test

  package:
    needs: [gate, static]
    if: needs.gate.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: polycord_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/polycord_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/polycord_test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run db:migrate
      - name: Verify Netlify packaging
        run: bun run netlify build --offline --context production
        env:
          AUTH_SECRET: polycord-isolated-audit-secret
          NEXT_PUBLIC_DISCOVERY_SKELETON_ENABLED: 'true'
          POLYCORD_ENVIRONMENT: local
          POLYCORD_ANALYTICS_DISABLED: 'true'
      - run: node scripts/check-netlify-package.mjs

  e2e:
    needs: [gate, static]
    if: needs.gate.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - args: --shard=1/2
            skeleton: 'true'
          - args: --shard=2/2
            skeleton: 'true'
          - args: e2e/discovery-bar-only.pw.ts e2e/dev-settings.pw.ts
            skeleton: 'false'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: polycord_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/polycord_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/polycord_test
      NEXT_PUBLIC_DISCOVERY_SKELETON_ENABLED: ${{ matrix.skeleton }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run db:migrate
      - uses: ./.github/actions/playwright
        timeout-minutes: 8
      - run: bun run test:e2e ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-${{ strategy.job-index }}
          path: test-results/

  storybook:
    needs: [gate, static]
    if: needs.gate.outputs.storybook == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build-storybook
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - uses: ./.github/actions/playwright
        timeout-minutes: 8
      - run: bun run test:storybook
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: storybook-test-results
          path: test-results/

  result:
    name: CI result
    needs: [gate, static, unit, package, e2e, storybook]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/ci-result.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RECORD_EVIDENCE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}

  deploy-staging:
    needs: [gate, result]
    if: >-
      !cancelled() &&
      needs.gate.outputs.deploy == 'true' &&
      needs.result.result == 'success' &&
      github.repository == 'chev0004/Polycord' &&
      github.ref == 'refs/heads/develop' &&
      github.event_name != 'pull_request' &&
      vars.NETLIFY_STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: write
    environment:
      name: staging
      url: https://polycord.chev.dev
    concurrency:
      group: netlify-staging
      queue: max
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: node scripts/deploy-staging.mjs
