name: Tests

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: polycord_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/polycord_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/polycord_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - run: bun run check:all
      - run: node --test scripts/deploy-staging.node.mjs
      - run: bun test
      - name: Verify Netlify packaging
        run: bun run netlify build --offline --context production
        env:
          AUTH_SECRET: polycord-isolated-audit-secret
          NEXT_PUBLIC_DISCOVERY_SKELETON_ENABLED: 'true'
          POLYCORD_ENVIRONMENT: local
          POLYCORD_ANALYTICS_DISABLED: 'true'
      - run: node scripts/check-netlify-package.mjs
      - run: bun run playwright install --with-deps chromium
        timeout-minutes: 8
      - run: bun run test:e2e
      - run: bun run test:e2e e2e/discovery-bar-only.pw.ts
        env:
          NEXT_PUBLIC_DISCOVERY_SKELETON_ENABLED: 'false'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/

  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build-storybook
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - run: bun run playwright install --with-deps chromium
        timeout-minutes: 8
      - run: bun run test:storybook
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: storybook-test-results
          path: test-results/

  deploy-staging:
    needs: [test, storybook]
    if: >-
      github.repository == 'chev0004/Polycord' &&
      github.ref == 'refs/heads/develop' &&
      github.event_name != 'pull_request' &&
      vars.NETLIFY_STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: staging
      url: https://polycord.chev.dev
    concurrency:
      group: netlify-staging
      cancel-in-progress: false
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: node scripts/deploy-staging.mjs
